# Opens PRs that bump the SHA-pinned actions in workflows, so the pins
# stay current. The Node 20 runtime deprecation that prompted this was
# cleared in #287.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Every pin lives in the same workflow file, so ungrouped updates arrive
    # as N PRs that all edit one line each and conflict with each other the
    # moment one merges. One PR per run instead.
    groups:
      actions:
        patterns:
          - "*"
