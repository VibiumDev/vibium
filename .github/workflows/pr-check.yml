name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: clicker/go.sum

      - name: Install dependencies
        run: npm install --force

      - name: Build Go binary
        run: make build-go
        if: runner.os != 'Windows'

      - name: Build JS client
        run: make build-js

      - name: Lint (Check formatting and imports)
        run: npm run lint
        # Allow workflow to continue even if lint fails - lint issues are informational for now
        continue-on-error: true

      - name: Run Node.js tests
        run: make test-js
        timeout-minutes: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-and-test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: clicker/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install dependencies
        run: npm install --force

      - name: Build Go binary and Python packages
        run: make build-go-all && make package-python
        if: runner.os != 'Windows'

      - name: Build Python packages (Windows)
        run: npm run build:python
        if: runner.os == 'Windows'

      - name: Run Python tests
        shell: bash
        run: |
          cd clients/python
          python -m venv .venv
          # Activate venv (handle both Unix and Windows paths)
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          # Install the platform-specific vibium package and the client
          pip install -q --upgrade pip
          pip install -q -e ../../packages/python/vibium_* -e .
          python tests/test_basic.py
        timeout-minutes: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.os }}-py-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
