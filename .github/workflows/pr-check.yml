name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: clicker/go.sum

      - name: Install dependencies
        run: npm install --force

      - name: Build Go binary
        run: make build-go

      - name: Build JS client
        run: make build-js

      - name: Install Chrome for Testing
        run: make install-browser

      - name: Setup Xvfb (virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Lint (Check formatting and imports)
        run: npm run lint
        # Allow workflow to continue even if lint fails - lint issues are informational for now
        continue-on-error: true

      - name: Run Node.js tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" make test-js
        timeout-minutes: 10
        env:
          CHROME_HEADLESS: "true"
          DISPLAY: ":99"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-and-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: clicker/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install dependencies
        run: npm install --force

      - name: Build Go binary and Python packages
        run: make build-go-all && make package-python

      - name: Install Chrome for Testing
        run: make install-browser

      - name: Setup Xvfb (virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Python tests
        run: |
          cd clients/python
          python -m venv .venv
          source .venv/bin/activate
          pip install -q --upgrade pip
          pip install -q -e ../../packages/python/vibium_* -e .
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python tests/test_basic.py
        timeout-minutes: 10
        env:
          CHROME_HEADLESS: "true"
          DISPLAY: ":99"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
