name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation that nothing builds or tests reads. Deliberately NOT
      # docs/tutorials/**: tests/py and tests/js extract code from those and
      # run it, so editing one can break the suite. Also not skills/**, whose
      # SKILL.md is copied into the binary by build-go, and not
      # docs/reference/api.md, which the API drift check parses as its spec.
      - 'docs/explanation/**'
      - 'docs/how-to-guides/**'
      - 'docs/images/**'
      - 'docs/plans/**'
      - 'docs/reference/WebDriver-Bidi-Spec.md'
      - 'docs/reference/mac-system-requirements.md'
      - 'docs/reference/recording-format.md'
      - 'docs/reference/selectors.md'
      - 'docs/reference/webdriver-bidi-overview.md'
      - 'docs/reference/webdriver-classic.md'
      - 'docs/specs/**'
      - 'docs/trackers/**'
      - 'docs/updates/**'
      - 'docs/README.md'
      # Root docs named individually. A bare glob's treatment of / is
      # not worth guessing at here: if it matched recursively it would
      # silently skip CI for skills/vibe-check/SKILL.md, which build-go
      # compiles in, and for the tutorials, which tests execute.
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'ROADMAP.md'
  pull_request:
    paths-ignore:
      # Documentation that nothing builds or tests reads. Deliberately NOT
      # docs/tutorials/**: tests/py and tests/js extract code from those and
      # run it, so editing one can break the suite. Also not skills/**, whose
      # SKILL.md is copied into the binary by build-go, and not
      # docs/reference/api.md, which the API drift check parses as its spec.
      - 'docs/explanation/**'
      - 'docs/how-to-guides/**'
      - 'docs/images/**'
      - 'docs/plans/**'
      - 'docs/reference/WebDriver-Bidi-Spec.md'
      - 'docs/reference/mac-system-requirements.md'
      - 'docs/reference/recording-format.md'
      - 'docs/reference/selectors.md'
      - 'docs/reference/webdriver-bidi-overview.md'
      - 'docs/reference/webdriver-classic.md'
      - 'docs/specs/**'
      - 'docs/trackers/**'
      - 'docs/updates/**'
      - 'docs/README.md'
      # Root docs named individually. A bare glob's treatment of / is
      # not worth guessing at here: if it matched recursively it would
      # silently skip CI for skills/vibe-check/SKILL.md, which build-go
      # compiles in, and for the tutorials, which tests execute.
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'ROADMAP.md'

# CI only reads the repo. Keeps the job's GITHUB_TOKEN read-only even if
# the repo default is ever write.
permissions:
  contents: read

# Forward the vibium binary's stderr through the JS and Python clients into
# the job log. Without it the clients drain stderr into a small in-memory
# tail that only surfaces on a client-raised error, so a hung test killed by
# the watchdog shows nothing: the #397 incident on run 32789877533 left the
# router's slow-delivery diagnostics (#403) unreadable. Costs a few
# connection lines per healthy test.
env:
  VIBIUM_STDERR: 1

jobs:
  chrome:
    runs-on: ubuntu-latest
    # Backstop only — scripts/timeout.mjs fails a hung suite after 10 min.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config where
          # build and test steps could read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 reached end of life in March 2026; 24 is the active LTS.
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Ubuntu 24.04 restricts unprivileged user namespaces, which breaks
      # Chrome's sandbox (HTTP 500 on session creation).
      - name: Configure kernel for Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      # Keyed on installer.go so installer changes fetch a fresh Chrome.
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vibium/chrome-for-testing
          key: ${{ runner.os }}-chrome-${{ hashFiles('clicker/internal/browser/installer.go') }}
          restore-keys: |
            ${{ runner.os }}-chrome-

      # npm ci installs exactly what the lockfile pins. The lockfile is
      # generated on macOS, so rollup's Linux native module is missing from
      # it and has to be added separately, locked to the rollup version the
      # lockfile installed so it cannot float to a newer release.
      - name: Install npm dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")

      - name: Build
        run: make

      # Browser-free: fails when api.md is malformed or a client column
      # claims a symbol the client does not export.
      - name: API drift check
        run: make check-api-drift

      # xvfb: the Python suite's headed tests need a display.
      # The NODE_TEST_TIMEOUT override is gone with Node 20: --test-timeout is
      # per test now, not per file, so the Makefile's 30s default applies and a
      # hung ordinary test surfaces in 30s.
      - name: Test
        run: xvfb-run --auto-servernum make test SUITE_PARALLEL=4

      - name: Audit capability selection
        run: make test-capability-audit

      # In case the job is interrupted before make test's own cleanup runs.
      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIBIUM_REQUIRE_FIREFOX: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Cache Firefox
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vibium/firefox
          key: ${{ runner.os }}-firefox-${{ hashFiles('clicker/internal/browser/installer_firefox.go') }}
          restore-keys: |
            ${{ runner.os }}-firefox-

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")

      - name: Build and install Firefox
        run: |
          make
          make install-firefox

      - name: Test Firefox capabilities
        run: xvfb-run --auto-servernum make test-firefox-capabilities

      - name: Test focused Firefox behavior
        run: xvfb-run --auto-servernum make test-firefox

      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  # Branch protection requires a check named "test" (the pre-split job).
  # This gate reports it, green only when both engine jobs pass. if: always()
  # keeps it from being skipped on failure, which protection would treat as
  # satisfied.
  test:
    runs-on: ubuntu-latest
    needs: [chrome, firefox]
    if: always()
    steps:
      - name: All suites green
        run: |
          test "${{ needs.chrome.result }}" = "success"
          test "${{ needs.firefox.result }}" = "success"
