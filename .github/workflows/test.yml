name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue batches. Without this the queue waits forever for the
  # required `test` check. The changes classifier treats merge_group like a
  # push: full suite, no docs-only skip.
  merge_group:

# Deliberately no paths/paths-ignore. Branch protection requires the checks
# this workflow reports, and a filter that skips the workflow also skips the
# report, which deadlocked documentation-only PRs (#303 fallout). The docs
# decision is made by the `changes` job below instead, so the check names
# always report exactly once. A twin workflow filtered on the inverse paths
# was tried and is worse: `paths` and `paths-ignore` both mean "any changed
# file matches", so they are not complements — a PR touching docs *and* code
# fires both, and the no-op twin reports the required `test` check green in
# ten seconds while the real suite is still running. PR #484 merged on that
# false green and left main red.

# CI only reads the repo. Keeps the job's GITHUB_TOKEN read-only even if
# the repo default is ever write.
permissions:
  contents: read

# A new push to a PR obsoletes that PR's running suite: cancel it rather
# than queue behind it — with two macOS runner slots org-wide, a stale run
# can hold real PRs in the queue for half an hour (see the pileup behind
# #688, where a branch update plus a base change stacked three identical
# runs). Pushes to main are exempt: each gets a unique group via run_id, so
# nothing ever cancels or queues behind a main build and every merge commit
# is tested in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Forward the vibium binary's stderr through the JS and Python clients into
# the job log. Without it the clients drain stderr into a small in-memory
# tail that only surfaces on a client-raised error, so a hung test killed by
# the watchdog shows nothing: the #397 incident on run 32789877533 left the
# router's slow-delivery diagnostics (#403) unreadable. Costs a few
# connection lines per healthy test.
env:
  VIBIUM_STDERR: 1

jobs:
  # Decides whether the browser suites apply. A markdown edit used to run the
  # full Go, JS, Python and Java suite for about six minutes and roughly one
  # commit in eight touches only documentation (#303), so those still skip —
  # but the skip now happens here, inside the workflow that reports the
  # required checks, instead of preventing it from running at all.
  #
  # Only pull requests are classified. A push to main always runs everything:
  # main staying green is worth more than six minutes, and a push can carry
  # commits a PR never saw.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push build: running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Documentation that nothing builds or tests reads. Deliberately NOT
          # docs/tutorials/**: tests/py and tests/js extract code from those
          # and run it, so editing one can break the suite. Also not skills/**,
          # whose SKILL.md is copied into the binary by build-go, and not
          # docs/reference/api.md, which the API drift check parses as its
          # spec. Root docs are listed one by one rather than globbed, so a
          # pattern can never quietly swallow a path that needs real CI.
          docs='^(docs/(explanation|how-to-guides|images|plans|specs|trackers|updates)/
          |docs/README\.md$
          |docs/reference/(WebDriver-Bidi-Spec|mac-system-requirements|recording-format|selectors|webdriver-bidi-overview|webdriver-classic)\.md$
          |CLAUDE\.md$
          |CODE_OF_CONDUCT\.md$
          |CONTRIBUTING\.md$
          |README\.md$
          |ROADMAP\.md$)'
          # Written across lines for readability; the pattern itself has no
          # whitespace, so folding it back is just deleting spaces and newlines.
          docs=$(printf '%s' "$docs" | tr -d ' \n')

          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')

          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # An empty file list is not a documentation change: say no and run
          # the suite rather than waving through a diff we failed to read.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo "Code touched: running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: skipping the browser suites."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # Each suite job runs on Linux and macOS via the matrix below. The include
  # entries carry what differs per OS:
  #   cache_root      — where paths.go puts browser downloads on that OS
  #   rollup_native   — npm drops optional native modules for platforms other
  #                     than the one that generated the lockfile (npm/cli#4828),
  #                     so each leg installs its own rollup module explicitly
  #   display_wrap    — the Python suite's headed tests need a display; only
  #                     Linux runners lack one, so only Linux wraps in xvfb
  #   python_version  — Linux holds the client's requires-python floor so a
  #                     change cannot lean on features newer than the oldest
  #                     Python we ship to; macOS tests a current Python,
  #                     covering the other end of the supported range. The
  #                     floor tracks CPython's security-fix window (see the
  #                     support policy in CONTRIBUTING.md)
  #   go_version      — Go emits the LC_UUID load command only from 1.23, and
  #                     the macOS 26 runner's dyld aborts binaries without it,
  #                     so macOS builds with current Go while Linux holds the
  #                     go.mod floor
  #   suite_parallel  — the macOS runner has 3 cores and 7 GB against Linux's
  #                     4 and 16, and renders Chrome in software; 4-way suite
  #                     parallelism intermittently starved it into scattered
  #                     30s test timeouts (run 38786751399). 2-way still ran
  #                     the JS suite against two pytest-xdist Chromes and kept
  #                     timing out the same way, with a renderer killed under
  #                     memory pressure in the second run ("Browsing context
  #                     is gone", runs 39296069220 and 39360774147), so macOS
  #                     runs suites serially.
  #   runner          — the machine the leg runs on. Linux stays on the
  #                     GitHub-hosted image; macOS runs on our self-hosted
  #                     Mac mini (vibium-mac-mini-dev-01, org-level runner,
  #                     10 cores / 32 GB). matrix.os remains the plain label
  #                     the include entries and cache keys match on.
  # Windows is not in the matrix yet: its legs need Go test fixes (Unix file
  # modes, XDG, path separators), Python client binary discovery for
  # vibium.exe, and a story for Firefox auto-install, which the binary
  # refuses on Windows.
  chrome:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      # A failing OS is signal about that OS; let the other legs finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, linux-arm64]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cache_root: ~/.cache/vibium
            rollup_native: '@rollup/rollup-linux-x64-gnu'
            display_wrap: xvfb-run --auto-servernum
            python_version: '3.11'
            suite_parallel: 4
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            cache_root: ~/Library/Caches/vibium
            rollup_native: '@rollup/rollup-darwin-arm64'
            python_version: '3.13'
            go_version: stable
            suite_parallel: 1
          # arm64 Linux risk is binary and arch handling (#675), not browser
          # behavior, so only this job carries the leg. Runs on the mini's
          # Linux VM (4 cores / 6 GB); 2-way suites starved it into the
          # known 30s-timeout signature (run 39657675176), so serial.
          - os: linux-arm64
            runner: [self-hosted, Linux, ARM64]
            cache_root: ~/.cache/vibium
            rollup_native: '@rollup/rollup-linux-arm64-gnu'
            display_wrap: xvfb-run --auto-servernum
            python_version: '3.11'
            suite_parallel: 1
            # Serial suites still ran 3 pytest-xdist Chromes (the Makefile
            # worker floor) and one crashed under memory pressure (run
            # 39679856714), so in-suite workers go serial too.
            worker_flags: PY_PARALLEL=1 JS_PARALLEL=1
    runs-on: ${{ matrix.runner }}
    # Backstop only — scripts/timeout.mjs fails a hung suite after 10 min.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config where
          # build and test steps could read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go-version is only set on macOS (see the matrix comment) and wins
          # over go-version-file there; everywhere else it is empty and the
          # go.mod version applies.
          go-version: ${{ matrix.go_version }}
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 reached end of life in March 2026; 24 is the active LTS.
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Ubuntu 24.04 restricts unprivileged user namespaces, which breaks
      # Chrome's sandbox (HTTP 500 on session creation).
      - name: Configure kernel for Chrome sandbox
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      # Keyed on browsers.json so pin bumps fetch a fresh browser and
      # unrelated installer changes keep the cache (#580).
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/chrome-for-testing
          key: ${{ runner.os }}-${{ runner.arch }}-chrome-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chrome-

      # npm ci installs exactly what the lockfile pins, minus this runner's
      # rollup native module (npm/cli#4828, see the matrix comment above),
      # which is added separately — locked to the rollup version the lockfile
      # installed so it cannot float to a newer release.
      - name: Install npm dependencies
        run: |
          npm ci
          npm install --no-save ${{ matrix.rollup_native }}@$(node -p "require('rollup/package.json').version")

      - name: Build
        run: make

      # Browser-free: fails when api.md is malformed or a client column
      # claims a symbol the client does not export. OS-independent, so one
      # leg is enough (not runner.os: that now matches two Linux legs).
      - name: API drift check
        if: matrix.os == 'ubuntu-latest'
        run: make check-api-drift

      # The NODE_TEST_TIMEOUT override is gone with Node 20: --test-timeout is
      # per test now, not per file, so the Makefile's 30s default applies and a
      # hung ordinary test surfaces in 30s.
      #
      # test-core is everything except the Check and Run suites (#513) and
      # the serial tail (browser-modes, firefox, daemon, js-sync), which both
      # run on the chrome-checks runner. Locally `make test` is still the
      # whole suite.
      - name: Test
        run: ${{ matrix.display_wrap }} make test-core SUITE_PARALLEL=${{ matrix.suite_parallel }} ${{ matrix.worker_flags }}

      - name: Audit capability selection
        run: make test-capability-audit

      # In case the job is interrupted before make test's own cleanup runs.
      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  # The Check and Run suites on the default engine, split from the chrome
  # job so its wall time stays near the pre-#484 suite's (#513), plus the
  # chrome job's serial tail (browser-modes, firefox, daemon, js-sync): the
  # tail is serial by nature, so it shortens the chrome leg by its full
  # length and roughly balances the two legs. Not a required check by name:
  # the test gate below fails unless this passes.
  chrome-checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cache_root: ~/.cache/vibium
            rollup_native: '@rollup/rollup-linux-x64-gnu'
            display_wrap: xvfb-run --auto-servernum
            python_version: '3.11'
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            cache_root: ~/Library/Caches/vibium
            rollup_native: '@rollup/rollup-darwin-arm64'
            python_version: '3.13'
            go_version: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go-version is only set on macOS (see the matrix comment) and wins
          # over go-version-file there; everywhere else it is empty and the
          # go.mod version applies.
          go-version: ${{ matrix.go_version }}
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Chrome's sandbox needs this on Ubuntu 24.04, same as the chrome job.
      - name: Configure kernel for Chrome sandbox
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      # Same key as the chrome job, so this restores what that job saved
      # rather than downloading Chrome again.
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/chrome-for-testing
          key: ${{ runner.os }}-${{ runner.arch }}-chrome-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chrome-

      - name: Install npm dependencies
        run: |
          npm ci
          npm install --no-save ${{ matrix.rollup_native }}@$(node -p "require('rollup/package.json').version")

      - name: Build
        run: make

      # One make invocation so the build prerequisites run once. test-firefox
      # behaves here exactly as it did in the chrome job: no Firefox is
      # installed, so it skips, and the firefox job still runs it for real.
      - name: Test Check, Run and the serial tail
        run: ${{ matrix.display_wrap }} make test-checkrun test-tail

      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  firefox:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cache_root: ~/.cache/vibium
            rollup_native: '@rollup/rollup-linux-x64-gnu'
            display_wrap: xvfb-run --auto-servernum
            python_version: '3.11'
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            cache_root: ~/Library/Caches/vibium
            rollup_native: '@rollup/rollup-darwin-arm64'
            python_version: '3.13'
            go_version: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VIBIUM_REQUIRE_FIREFOX: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go-version is only set on macOS (see the matrix comment) and wins
          # over go-version-file there; everywhere else it is empty and the
          # go.mod version applies.
          go-version: ${{ matrix.go_version }}
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Cache Firefox
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/firefox
          key: ${{ runner.os }}-${{ runner.arch }}-firefox-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-firefox-

      # install-browser below still fetches Chrome. Same key as the chrome
      # job, so this restores what that job saved rather than downloading
      # Chrome again.
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/chrome-for-testing
          key: ${{ runner.os }}-${{ runner.arch }}-chrome-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chrome-

      # Chrome's sandbox needs this on Ubuntu 24.04, same as the chrome job.
      - name: Configure kernel for Chrome sandbox
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save ${{ matrix.rollup_native }}@$(node -p "require('rollup/package.json').version")

      - name: Build and install browsers
        run: |
          make
          make install-firefox
          make install-browser

      - name: Test Firefox capabilities
        run: ${{ matrix.display_wrap }} make test-firefox-capabilities

      - name: Test focused Firefox behavior
        run: ${{ matrix.display_wrap }} make test-firefox

      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  # Same suites chrome-checks runs, with the engine parameter pointed at
  # Firefox — the shape every other engine-parity target already uses (#494).
  # Split from the firefox job for the same reason chrome-checks exists:
  # these suites stand alone and were the firefox job's longest step (#513).
  firefox-checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cache_root: ~/.cache/vibium
            rollup_native: '@rollup/rollup-linux-x64-gnu'
            display_wrap: xvfb-run --auto-servernum
            python_version: '3.11'
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            cache_root: ~/Library/Caches/vibium
            rollup_native: '@rollup/rollup-darwin-arm64'
            python_version: '3.13'
            go_version: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VIBIUM_REQUIRE_FIREFOX: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go-version is only set on macOS (see the matrix comment) and wins
          # over go-version-file there; everywhere else it is empty and the
          # go.mod version applies.
          go-version: ${{ matrix.go_version }}
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            clients/python/pyproject.toml
            packages/python/vibium_linux_x64/pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Cache Firefox
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/firefox
          key: ${{ runner.os }}-${{ runner.arch }}-firefox-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-firefox-

      # These suites drive Chrome for their non-Firefox cases. Same key as
      # the chrome job, so this restores what that job saved rather than
      # downloading Chrome again.
      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_root }}/chrome-for-testing
          key: ${{ runner.os }}-${{ runner.arch }}-chrome-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chrome-

      # Chrome's sandbox needs this on Ubuntu 24.04, same as the chrome job.
      - name: Configure kernel for Chrome sandbox
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save ${{ matrix.rollup_native }}@$(node -p "require('rollup/package.json').version")

      - name: Build and install browsers
        run: |
          make
          make install-firefox
          make install-browser

      - name: Test Check and Run on Firefox
        run: ${{ matrix.display_wrap }} make test-check test-run ENGINE=firefox

      - name: Clean up zombie processes
        if: always()
        run: make double-tap

  # Windows smoke (#635). Windows ships the binary but the suite runs only on
  # Linux and macOS, so a recurring class of Windows-only process-cleanup bugs
  # (#622, and before it #78/#325/#49/#47/#31/#16) reaches users first: the
  # orphan sweep is ps-based and cannot run there at all. This runs the one
  # browser-process cleanup test on a GitHub-hosted windows-2025 runner — build,
  # install Chrome for Testing, and assert daemon start/stop and serve shutdown
  # leave no orphaned Chrome. process.test.js self-skips its POSIX-only cases,
  # and Firefox has no Windows auto-install so the leg stays Chrome-only. Kept
  # to the single file to stay cheap. Plain go build and bash steps rather than
  # make, which the Windows image does not carry.
  windows:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clicker/go.mod
          cache-dependency-path: clicker/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/vibium/chrome-for-testing
          key: ${{ runner.os }}-chrome-${{ hashFiles('clicker/internal/paths/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-chrome-

      # No make on the Windows image: copy the embeds the Makefile would and
      # go build directly.
      - name: Build vibium.exe
        shell: bash
        run: |
          cp skills/browser/SKILL.md clicker/cmd/clicker/SKILL.md
          cp skills/check/SKILL.md clicker/cmd/clicker/CHECK_SKILL.md
          cp config/ai.env clicker/cmd/clicker/AI_ENV_TEMPLATE
          cp config/cloud-browser.env clicker/cmd/clicker/CLOUD_ENV_TEMPLATE
          cd clicker && go build -trimpath -o bin/vibium.exe ./cmd/clicker

      - name: Install Chrome for Testing
        shell: bash
        run: ./clicker/bin/vibium.exe install

      - name: Process-cleanup smoke
        shell: bash
        run: node --test --test-timeout=60000 --test-concurrency=1 tests/cli/process.test.js

      - name: Clean up stray processes
        if: always()
        shell: pwsh
        run: |
          Get-Process chrome,chromedriver,vibium,firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

  # Branch protection requires a check named "test" (the pre-split job).
  # This gate reports it, green only when every suite job passes. The check
  # and run shards are not required by name, so this is the only thing that
  # enforces them — a new suite job must be added here or it is decorative.
  # Each needs result below aggregates every OS leg of that job's matrix, so
  # a failure on any OS fails the gate.
  # if: always() keeps the gate from being skipped on failure, which
  # protection would treat as satisfied.
  test:
    runs-on: ubuntu-latest
    needs: [changes, chrome, chrome-checks, firefox, firefox-checks, windows]
    if: always()
    steps:
      - name: All suites green
        run: |
          # A classifier that failed leaves the engine jobs skipped for the
          # wrong reason, which would otherwise read as a documentation-only
          # pass. Fail instead of guessing.
          test "${{ needs.changes.result }}" = "success"

          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            echo "Documentation-only change, browser suites not applicable."
            exit 0
          fi

          test "${{ needs.chrome.result }}" = "success"
          test "${{ needs['chrome-checks'].result }}" = "success"
          test "${{ needs.firefox.result }}" = "success"
          test "${{ needs['firefox-checks'].result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
