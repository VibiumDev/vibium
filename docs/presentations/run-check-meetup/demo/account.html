<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account settings · Meetup demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#172c2a;font-family:Arial,Helvetica,sans-serif}header{height:104px;padding:0 64px;border-bottom:1px solid #cccfc4;display:flex;align-items:center;justify-content:space-between;font-size:22px}header strong{font-size:31px;letter-spacing:-1.5px}header span{color:#50655d}main{max-width:1100px;margin:54px auto}.eyebrow{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#50655d}h1{font-size:48px;letter-spacing:-2px;margin:14px 0 40px}.layout{display:grid;grid-template-columns:260px 1fr;gap:70px}aside{border-right:1px solid #cccfc4;min-height:390px}aside p{font-size:21px;margin:0 0 25px}aside .active{font-weight:700;color:#00644f}form{max-width:680px}label{display:block;font-size:19px;font-weight:700;margin-bottom:13px}input{display:block;width:100%;font:26px Arial;padding:20px;border:1px solid #a8b5ab;border-radius:5px;background:#fffdf8;color:#172c2a;outline-offset:4px}.hint{font-size:18px;color:#586b62;margin:14px 0 38px;line-height:1.5}button{background:#075c4b;color:white;border:0;border-radius:5px;padding:20px 29px;font-size:21px;font-weight:700;cursor:pointer}button:focus,input:focus{outline:3px solid #c8a730}#status{min-height:70px;font-size:24px;line-height:1.5;font-weight:700;color:#075c4b;margin-top:27px}.foot{font-size:15px;color:#62766b;margin-top:38px}
</style>
<header><strong>vibium / demo</strong><span>Demo workspace</span></header>
<main><div class="eyebrow">Your workspace</div><h1>Account settings</h1><div class="layout">
<aside aria-label="Settings sections"><p>Profile</p><p>Notifications</p><p class="active">Preferences</p><p>Connected apps</p></aside>
<form><label for="timezone">Timezone</label><input id="timezone" name="timezone" autocomplete="off"><p class="hint">Dates and times in your workspace use this timezone.</p><button type="submit">Save changes</button><p id="status" role="status" aria-live="polite"></p></form>
</div><p class="foot">Local meetup fixture. Test data only.</p></main>
<script>
const field=document.querySelector('#timezone');
const persists=new URLSearchParams(location.search).get('persist')==='1';
field.value=persists?(localStorage.getItem('meetup-timezone')||'UTC'):'UTC';
document.querySelector('form').addEventListener('submit',event=>{
  event.preventDefault();
  if(persists)localStorage.setItem('meetup-timezone',field.value);
  document.querySelector('#status').textContent='Saved. Your timezone is '+field.value+'.';
});
</script>
</html>
