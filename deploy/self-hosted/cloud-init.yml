#cloud-config
# Shared bootstrap for any cloud-init-capable VM: Chrome + chromedriver
# as a systemd service on 127.0.0.1:9515, reached over an SSH tunnel.
# Used by the DigitalOcean, Hetzner, and GCP kits — see each kit's
# README for its create command; it also runs unchanged on most other
# clouds that accept user-data.
#
# Note: cloud-init downloads setup-chrome.sh from the vibium repo's main
# branch. Until the deploy kits land there, paste the script into
# write_files instead, or scp it up and run it by hand.

package_update: true

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/VibiumDev/vibium/main/deploy/self-hosted/setup-chrome.sh -o /root/setup-chrome.sh
  - bash /root/setup-chrome.sh --service
